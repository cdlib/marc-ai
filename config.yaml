model:
  # Inputs features
  features:
    - title_tokenset
    - title_agg
    - author
    - publisher
    - pub_date
    - pub_place
    - pagination
  
  # Training
  batch_size: 512
  weight_decay: 0.0
  max_epochs: -1

  # Disable early stopping with -1
  patience: 20
  
  lr: 0.006
  optimizer: Adam
  saved_models_dir: saved_models

  # Hard negative mining
  use_hard_negative_mining: true
  hard_negative_weight: 3.0   # Weight multiplier for hard negative examples
  mining_threshold: 0.7       # Threshold above which non-matches are considered "hard"
  mining_frequency: 2         # How often to mine hard negatives (every N epochs)

  # Paths to dataset splits
  test_processed_path: data/test_processed.csv
  train_processed_path: data/train_processed.csv
  val_processed_path: data/val_processed.csv
